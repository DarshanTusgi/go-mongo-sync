version: '3.8'

services:
  # MongoDB instances
  cloud-mongodb:
    image: mongo:6.0
    container_name: cloud-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=real_transfer_test
    ports:
      - "27017:27017"
    volumes:
      - cloud_mongodb_data:/data/db
      - ./init-cloud-data.js:/docker-entrypoint-initdb.d/init-data.js:ro
    networks:
      - sync-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  local-mongodb:
    image: mongo:6.0
    container_name: local-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    ports:
      - "27018:27017"
    volumes:
      - local_mongodb_data:/data/db
    networks:
      - sync-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloud Sync Server with Auto-Distribution
  cloud-sync:
    build:
      context: .
      dockerfile: Dockerfile.cloud-sync
    container_name: cloud-sync-auto
    restart: unless-stopped
    environment:
      - CLOUD_SYNC_LICENSE=${CLOUD_SYNC_LICENSE:-123e4567-e89b-12d3-a456-426614174000}
      - VM_SYNC_LICENSES=${VM_SYNC_LICENSES:-987fcdeb-51a2-43d7-b654-321098765432,123e4567-e89b-12d3-a456-426614174001,987fcdeb-51a2-43d7-b654-321098765433}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - MONGODB_URI=mongodb://admin:password123@cloud-mongodb:27017/?authSource=admin
      - ENCRYPTION_KEY_ID=cloud-sync-key-001
      - ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleS0yNTYtYml0cy1mb3ItYWVzLWdj
    ports:
      - "8080:8080"  # HTTP + WebSocket
    volumes:
      - ./examples/cloud-config.yaml:/app/config.yaml:ro
      - cloud_sync_logs:/app/logs
    networks:
      - sync-network
    depends_on:
      cloud-mongodb:
        condition: service_healthy
    command: ["./cloud-sync", "-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # VM Sync Client 1 - AUTO DISTRIBUTION (NO COLLECTIONS CONFIG!)
  vm-sync-1:
    build:
      context: .
      dockerfile: Dockerfile.vm-sync
    container_name: vm-sync-auto-1
    restart: unless-stopped
    environment:
      - VM_SYNC_LICENSE=987fcdeb-51a2-43d7-b654-321098765432
      - VM_SYNC_PORT=8081
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
    ports:
      - "8081:8081"  # HTTP
      - "9001:9000"  # TCP
    volumes:
      - ./examples/vm-config-auto.yaml:/app/config.yaml:ro
      - vm_sync_1_logs:/app/logs
      - vm_sync_1_checkpoints:/tmp/vm-sync-tcp-checkpoints
    networks:
      - sync-network
    depends_on:
      cloud-sync:
        condition: service_healthy
      local-mongodb:
        condition: service_healthy
    command: ["./vm-sync", "-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # VM Sync Client 2 - AUTO DISTRIBUTION (NO COLLECTIONS CONFIG!)
  vm-sync-2:
    build:
      context: .
      dockerfile: Dockerfile.vm-sync
    container_name: vm-sync-auto-2
    restart: unless-stopped
    environment:
      - VM_SYNC_LICENSE=123e4567-e89b-12d3-a456-426614174001
      - VM_SYNC_PORT=8082
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
    ports:
      - "8082:8082"  # HTTP
      - "9002:9000"  # TCP
    volumes:
      - ./examples/vm-config-auto.yaml:/app/config.yaml:ro
      - vm_sync_2_logs:/app/logs
      - vm_sync_2_checkpoints:/tmp/vm-sync-tcp-checkpoints
    networks:
      - sync-network
    depends_on:
      cloud-sync:
        condition: service_healthy
      local-mongodb:
        condition: service_healthy
    command: ["./vm-sync", "-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # VM Sync Client 3 - AUTO DISTRIBUTION (NO COLLECTIONS CONFIG!)
  vm-sync-3:
    build:
      context: .
      dockerfile: Dockerfile.vm-sync
    container_name: vm-sync-auto-3
    restart: unless-stopped
    environment:
      - VM_SYNC_LICENSE=987fcdeb-51a2-43d7-b654-321098765433
      - VM_SYNC_PORT=8083
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
    ports:
      - "8083:8083"  # HTTP
      - "9003:9000"  # TCP
    volumes:
      - ./examples/vm-config-auto.yaml:/app/config.yaml:ro
      - vm_sync_3_logs:/app/logs
      - vm_sync_3_checkpoints:/tmp/vm-sync-tcp-checkpoints
    networks:
      - sync-network
    depends_on:
      cloud-sync:
        condition: service_healthy
      local-mongodb:
        condition: service_healthy
    command: ["./vm-sync", "-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Dashboard
  dashboard:
    image: nginx:alpine
    container_name: sync-dashboard-auto
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sync-network
    depends_on:
      - cloud-sync

volumes:
  cloud_mongodb_data:
    driver: local
  local_mongodb_data:
    driver: local
  cloud_sync_logs:
    driver: local
  vm_sync_1_logs:
    driver: local
  vm_sync_2_logs:
    driver: local
  vm_sync_3_logs:
    driver: local
  vm_sync_1_checkpoints:
    driver: local
  vm_sync_2_checkpoints:
    driver: local
  vm_sync_3_checkpoints:
    driver: local

networks:
  sync-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16