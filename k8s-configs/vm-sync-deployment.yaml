apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-sync
  namespace: data-sync
  labels:
    app: vm-sync
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vm-sync
  template:
    metadata:
      labels:
        app: vm-sync
    spec:
      containers:
      - name: vm-sync
        image: go-data-sync:latest
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 9000
          name: tcp-receiver
        env:
        # Database configuration
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: vm-sync-secrets
              key: mongodb-uri
        
        # OAuth2 configuration for HTTP telemetry
        - name: VM_SYNC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: vm-sync-secrets
              key: client-id
        - name: VM_SYNC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: vm-sync-secrets
              key: client-secret
        
        # Encryption configuration (must match cloud-sync)
        - name: ENCRYPTION_KEY_ID
          value: "cloud-sync-prod-key-001"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: vm-sync-secrets
              key: encryption-key
        
        # Logging configuration
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: logs
          mountPath: /app/logs
        - name: tcp-checkpoints
          mountPath: /tmp/vm-sync-tcp-checkpoints
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      
      volumes:
      - name: config
        configMap:
          name: vm-sync-config
      - name: logs
        emptyDir: {}
      - name: tcp-checkpoints
        persistentVolumeClaim:
          claimName: vm-sync-checkpoints

---
apiVersion: v1
kind: Service
metadata:
  name: vm-sync-service
  namespace: data-sync
spec:
  selector:
    app: vm-sync
  ports:
  - name: http
    port: 80
    targetPort: 8081
  - name: tcp-receiver
    port: 9000
    targetPort: 9000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vm-sync-ingress
  namespace: data-sync
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - xyz.com
    secretName: xyz-com-tls
  rules:
  - host: xyz.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vm-sync-service
            port:
              number: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-sync-config
  namespace: data-sync
data:
  config.yaml: |
    # Content from vm-sync-domain.yaml will be inserted here
    # This is managed separately for easier updates

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-sync-checkpoints
  namespace: data-sync
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi