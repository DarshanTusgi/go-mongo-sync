apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sync
  namespace: data-sync
  labels:
    app: cloud-sync
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-sync
  template:
    metadata:
      labels:
        app: cloud-sync
    spec:
      containers:
      - name: cloud-sync
        image: go-data-sync:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        # Domain-based routing configuration
        - name: BASE_PATH
          value: ""  # No base path for domain-based routing
        - name: TENANT_ID
          value: ""
        - name: COMMUNITY_ID
          value: ""
        
        # Database configuration
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: cloud-sync-secrets
              key: mongodb-uri
        
        # VM-Sync target configuration
        - name: VM_SYNC_TCP_ADDRESS
          value: "xyz.com:9000"  # Target VM-Sync domain
        
        # Encryption configuration
        - name: ENCRYPTION_KEY_ID
          value: "cloud-sync-prod-key-001"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: cloud-sync-secrets
              key: encryption-key
        
        # Logging configuration
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: logs
          mountPath: /app/logs
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      
      volumes:
      - name: config
        configMap:
          name: cloud-sync-config
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: cloud-sync-service
  namespace: data-sync
spec:
  selector:
    app: cloud-sync
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-sync-ingress
  namespace: data-sync
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/websocket-services: "cloud-sync-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - darshan.com
    secretName: darshan-com-tls
  rules:
  - host: darshan.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloud-sync-service
            port:
              number: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-sync-config
  namespace: data-sync
data:
  config.yaml: |
    # Content from cloud-sync-domain.yaml will be inserted here
    # This is managed separately for easier updates