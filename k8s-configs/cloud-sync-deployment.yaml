apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sync
  namespace: data-sync
  labels:
    app: cloud-sync
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-sync
  template:
    metadata:
      labels:
        app: cloud-sync
    spec:
      containers:
      - name: cloud-sync
        image: go-data-sync:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        # Domain-based routing configuration
        - name: BASE_PATH
          value: ""  # No base path for domain-based routing
        - name: TENANT_ID
          value: ""
        - name: COMMUNITY_ID
          value: ""
        
        # Database configuration
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: cloud-sync-secrets
              key: mongodb-uri
        
        # VM-Sync target configuration
        - name: VM_SYNC_TCP_ADDRESS
          value: "xyz.com:9000"  # Target VM-Sync domain
        
        # Encryption configuration
        - name: ENCRYPTION_KEY_ID
          value: "cloud-sync-prod-key-001"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: cloud-sync-secrets
              key: encryption-key
        
        # Logging configuration
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: logs
          mountPath: /app/logs
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      
      volumes:
      - name: config
        configMap:
          name: cloud-sync-config
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: cloud-sync-service
  namespace: data-sync
spec:
  selector:
    app: cloud-sync
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-sync-ingress
  namespace: data-sync
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/websocket-services: "cloud-sync-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - darshan.com
    secretName: darshan-com-tls
  rules:
  - host: darshan.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloud-sync-service
            port:
              number: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-sync-config
  namespace: data-sync
data:
  config.yaml: |
    # Cloud-Sync Kubernetes Production Configuration
    # Deployed on darshan.com domain
    # ⚠️ KUBERNETES REQUIREMENT: Host MUST be "0.0.0.0"
    
    server:
      port: 8080
      host: "0.0.0.0"        # ⚠️ CRITICAL: Must be 0.0.0.0 in Kubernetes!
      read_timeout: "30s"
      write_timeout: "30s"
      idle_timeout: "120s"
    
    websocket:
      endpoint: "/ws"
      max_message_size: 10485760
      ping_interval: "30s"
      pong_wait: "60s"
    
    mongodb:
      # Inject via secret - see MONGODB_URI env var
      uri: "${MONGODB_URI}"
      timeout: 30s
      databases:
        - name: "real_transfer_test"
          enabled: true
          collections:
            - name: "products"
              enabled: true
            - name: "customers"
              enabled: true
            - name: "orders"
              enabled: true
            - name: "inventory"
              enabled: true
    
    sync:
      resumable_initial_sync: true
      force_initial_sync: false
      
      transport:
        mode: "tcp"
        http_fallback: true
        compression_type: "zstd"
        health_monitor: "30s"
        tcp_sender:
          # Target VM-Sync at xyz.com (cross-domain)
          address: "${VM_SYNC_TCP_ADDRESS}"  # xyz.com:9000
          parallel_conns: 8
          window_size: 128
          batch_timeout: 10s
          conn_timeout: 60s
          keep_alive: 30s
          max_retries: 5
          retry_backoff: 2s
          buffer_size: 1048576
          max_batch_size: 67108864
    
    encryption:
      enabled: true
      algorithm: "AES-256-GCM"
      # Inject via secret - see ENCRYPTION_KEY env vars
      key_id: "${ENCRYPTION_KEY_ID}"
      key: "${ENCRYPTION_KEY}"
    
    checkpoint:
      enabled: true
      database: "cloud_sync_checkpoints"
      collection: "resume_tokens"
      save_interval: 30
    
    tracking:
      enabled: true
      database: "cloud_sync_tracking"
      collection: "transfers"
      cleanup_interval: 3600
      retention_days: 7
    
    sequence:
      enabled: true
      database: "cloud_sync_sequences"
      collection: "counters"
      batch_size: 1000
      node_id: "cloud-sync-k8s-pod"
    
    fence:
      enabled: true
    
    internal_cluster:
      enabled: false