# ═══════════════════════════════════════════════════════════════════════
#                    CLOUD-SYNC SAMPLE CONFIGURATION
#              MongoDB Atlas → VM-Sync Data Synchronization
# ═══════════════════════════════════════════════════════════════════════
#
# REQUIRED ENVIRONMENT VARIABLES:
#   database_name=<your-db-suffix>       # Example: abc → real_transfer-abc
#   TENANT_NAME=<tenant>                 # Example: kotak
#   COMMUNITY_NAME=<community>           # Example: default
#   INFRA_LICENSE_KEY=<license-key>      # Example: admin-key-123
#
# OPTIONAL ENVIRONMENT VARIABLES:
#   MONGODB_URI=<connection-string>      # Override MongoDB URI
#   ENCRYPTION_KEY=<base64-key>          # 32-byte encryption key
#   VM_SYNC_ENDPOINT=<url>               # VM-sync HTTP endpoint
#
# FEATURES ENABLED:
#   ✓ Document filtering (exclude deleted records)
#   ✓ Field filtering (project specific fields only)
#   ✓ Database routing (source → target name mapping)
#   ✓ TCP transport (4 parallel connections, ultra-stable)
#   ✓ Resume tokens (fault-tolerant CDC)
#   ✓ OAuth2 authentication
#   ✓ Scheduler-based incremental sync (1-minute interval)
#   ✓ AES-256-GCM encryption
#   ✓ Multi-tenancy support

# ═══════════════════════════════════════════════════════════════════════
#                         SERVER CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════

server:
  port: 8080
  host: "0.0.0.0"         # Listen on all interfaces for production
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"

# ═══════════════════════════════════════════════════════════════════════
#                      MONGODB SOURCE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════

mongodb:
  # MongoDB Atlas connection (source database)
  uri: "mongodb+srv://admin:IdZcKnNvmWqea13k@proptuity-dev.mgzig.mongodb.net"
  timeout: 30s
  
  # Collections configuration file (with document & field filters)
  collections_config_file: "configs/collections-sample.json"

# ═══════════════════════════════════════════════════════════════════════
#                    WEBSOCKET & SYNC CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════

# WebSocket configuration for vm-sync connectivity
websocket:
  enabled: true
  endpoint: "/ws"
  max_connections: 100
  ping_interval: "30s"
  pong_timeout: "10s"

# Synchronization settings
sync:
  initial_sync: true              # Enable initial bulk dump
  realtime_sync: false            # Disabled (use scheduler_sync instead)
  scheduler_sync: true            # Scheduler-based incremental sync
  scheduler_interval: "1m"        # 1-minute incremental sync cycle
  resumable_initial_sync: true    # Resume from last checkpoint
  batch_size: 10000               # Documents per batch
  parallel_collections: true
  max_workers: 16                 # Parallel worker threads
  
  # TCP transport configuration (primary mode)
  transport:
    mode: "tcp"                   # Primary: TCP, Fallback: HTTP
    http_fallback: false          # TCP is mandatory (no HTTP fallback)
    compression_type: "zstd"      # Zstd compression
    health_monitor: "30s"         # TCP health check interval
    
    tcp_sender:
      parallel_conns: 4           # 4 parallel TCP connections
      window_size: 64             # Flow control window
      batch_timeout: 60s
      conn_timeout: 180s
      keep_alive: 120s
      max_retries: 8
      retry_backoff: 3s
      buffer_size: 1048576        # 1MB buffer
      max_batch_size: 67108864    # 64MB max batch
      tls_enabled: false

# ═══════════════════════════════════════════════════════════════════════
#              SECURITY & PERSISTENCE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════

# AES-256-GCM encryption
encryption:
  enabled: true
  algorithm: "AES-256-GCM"
  key_id: "cloud-sync-key-001"
  key: "dGVzdC1lbmNyeXB0aW9uLWtleS0yNTYtYml0cy1mb3ItYWVzLWdj"  # Base64 32-byte key

# Logging configuration
logging:
  level: "info"          # Options: debug, info, warn, error
  format: "json"
  output: "stdout"

# Resume token checkpoint storage (MongoDB Atlas)
checkpoint:
  enabled: true
  database: "sync_checkpoints"
  collection: "resume_tokens"
  save_interval_seconds: 5
  cleanup_enabled: true
  retention_days: 30

# Transfer tracking for exactly-once delivery
tracking:
  enabled: true
  mongo_uri: "mongodb+srv://admin:IdZcKnNvmWqea13k@proptuity-dev.mgzig.mongodb.net"
  database: "sync_tracking"
  state_collection: "client_sync_states"
  batch_collection: "transfer_batches"

# Sequence generation for ordered events
sequence:
  enabled: true
  database: "sync_sequences"
  collection: "sequence_counters"
  batch_size: 1000
  node_id: "cloud-sync-node-001"

# Cluster time fence for consistency
fence:
  enabled: true

# ═══════════════════════════════════════════════════════════════════════
#                     MULTI-TENANCY CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════

tenant:
  name: ""               # Set via TENANT_NAME env var
  community: ""          # Set via COMMUNITY_NAME env var

# ═══════════════════════════════════════════════════════════════════════
#                      PERFORMANCE TUNING
# ═══════════════════════════════════════════════════════════════════════

performance:
  max_workers: 16          # Maximum parallel workers
  buffer_size: 1000
  batch_timeout: "5s"
  retry_attempts: 3
  retry_delay: "2s"