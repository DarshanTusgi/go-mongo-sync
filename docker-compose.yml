version: '3.8'

services:
  # Cloud MongoDB (source database)
  cloud-mongodb:
    image: mongo:7.0
    container_name: cloud-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: sync-test-db
    ports:
      - "27018:27017"
    volumes:
      - cloud_mongodb_data:/data/db
      - ./scripts/init-cloud-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    networks:
      - sync-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local MongoDB (replica database)
  local-mongodb:
    image: mongo:7.0
    container_name: local-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - local_mongodb_data:/data/db
    networks:
      - sync-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloud Sync Server
  cloud-sync:
    build:
      context: .
      dockerfile: Dockerfile.cloud-sync
    container_name: cloud-sync
    restart: unless-stopped
    environment:
      - CLOUD_SYNC_LICENSE=${CLOUD_SYNC_LICENSE:-987fcdeb-51a2-43d7-b654-321098765432}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - WS_HOST=0.0.0.0
      - WS_PORT=8080
    ports:
      - "8080:8080"  # WebSocket port
      - "9090:9090"  # Metrics port
    volumes:
      - ./examples/cloud-config.yaml:/app/config.yaml:ro
      - cloud_sync_logs:/app/logs
    networks:
      - sync-network
    depends_on:
      cloud-mongodb:
        condition: service_healthy
    command: ["./cloud-sync", "-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # VM Sync Client
  vm-sync:
    build:
      context: .
      dockerfile: Dockerfile.vm-sync
    container_name: vm-sync
    restart: unless-stopped
    environment:
      - VM_SYNC_LICENSE=${VM_SYNC_LICENSE:-987fcdeb-51a2-43d7-b654-321098765432}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - SYNC_INITIAL=true
      - SYNC_BATCH_SIZE=1000
      - SYNC_WORKERS=4
    volumes:
      - ./examples/vm-config.yaml:/app/config.yaml:ro
      - vm_sync_logs:/app/logs
      - vm_sync_state:/app/state
    networks:
      - sync-network
    depends_on:
      cloud-sync:
        condition: service_healthy
      local-mongodb:
        condition: service_healthy
    command: ["./vm-sync", "-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "pgrep", "vm-sync"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Dashboard (optional)
  dashboard:
    image: nginx:alpine
    container_name: sync-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sync-network
    depends_on:
      - cloud-sync

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sync-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - cloud-sync

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - sync-network
    depends_on:
      - prometheus

volumes:
  cloud_mongodb_data:
    driver: local
  local_mongodb_data:
    driver: local
  cloud_sync_logs:
    driver: local
  vm_sync_logs:
    driver: local
  vm_sync_state:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  sync-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16