# Test configuration without restrictive filters
server:
  port: 8080
  host: "localhost"
  read_timeout: "300s"   # Increased for large data transfers
  write_timeout: "300s"  # Increased for large data transfers
  idle_timeout: "60s"
  data_timeout: "600s"   # 10 minutes for large data requests

mongodb:
  uri: "mongodb+srv://admin:IdZcKnNvmWqea13k@proptuity-dev.mgzig.mongodb.net"
  timeout: 30s
  databases:
    - name: "new_test_db"
      enabled: true
      priority: 1
      collections:
        - name: "orders"
          enabled: true
          batch_size: 100   # Very small batches for reliable transfers
          priority: 1
    - name: "new_test_db_2"
      enabled: true
      priority: 2
      collections:
        - name: "orders"
          enabled: true
          batch_size: 100   # Very small batches for reliable transfers
          priority: 2

# WebSocket configuration
websocket:
  enabled: true
  endpoint: "/ws"
  max_connections: 100
  ping_interval: "30s"
  pong_timeout: "10s"

logging:
  level: "debug"
  format: "text"
  output: "stdout"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"

# Encryption configuration
encryption:
  enabled: true
  algorithm: "AES-256-GCM"
  key_id: "cloud-sync-key-001"
  key: "dGVzdC1lbmNyeXB0aW9uLWtleS0yNTYtYml0cy1mb3ItYWVzLWdj"  # Base64 encoded 32-byte key

# Checkpoint configuration for resumable synchronization
checkpoint:
  enabled: false
  database: "sync_checkpoints"
  collection: "resume_tokens"
  save_interval_seconds: 5
  cleanup_enabled: true
  retention_days: 30

# Transfer tracking configuration
tracking:
  enabled: false
  mongo_uri: "mongodb://localhost:27017"
  database: "sync_tracking"
  transfer_collection: "transfer_records"
  state_collection: "client_sync_states"
  batch_collection: "transfer_batches"

# Sequence number generation for ordered event processing
sequence:
  enabled: true
  database: "sync_sequences"
  collection: "sequence_counters"
  batch_size: 1000
  node_id: "cloud-sync-node-001"

# Cluster time fence for snapshot consistency
fence:
  enabled: true

# License validation
license:
  validation_enabled: false  # Keep disabled for testing

# Disconnection tolerance and buffering configuration
disconnection:
  # Maximum time to buffer changes during vm-sync disconnection
  max_buffer_duration: "30m"
  # Maximum number of changes to buffer in memory
  max_buffer_size: 10000
  # Timeout for detecting client disconnection
  disconnection_timeout: "60s"
  # Enable catch-up synchronization on reconnection
  catch_up_sync_enabled: true
  # Maximum time to wait for reconnection before clearing buffer
  reconnection_timeout: "1h"