# VM-sync HTTP client configuration
# 
# License Configuration (Environment Variable):
# VM_SYNC_LICENSE="vm-tag,vm-uuid-456"  # VM-sync license key
# 
# This license must be included in the cloud-sync's VM_SYNC_LICENSES
# environment variable for successful WebSocket authentication.
#
# Production Environment Variables (optional):
# VM_SYNC_LICENSE: Your vm-sync license UUID (must match cloud-sync authorization)
# MONGODB_URI: Your local MongoDB connection string
# CLOUD_SYNC_URL: URL of your cloud-sync server (e.g., https://your-cloud-sync.com)
# CLOUD_SYNC_WS_URL: WebSocket URL of your cloud-sync server (e.g., wss://your-cloud-sync.com/ws)
# ENCRYPTION_KEY: Base64 encoded 32-byte encryption key (must match cloud-sync)
# ENCRYPTION_KEY_ID: Unique identifier for your encryption key (must match cloud-sync)

# VM-sync HTTP server configuration
server:
  port: 8081                  # HTTP server port (can override with VM_SYNC_PORT env var)
  host: "0.0.0.0"             # Listen on all interfaces (use "localhost" for local-only)
  read_timeout: "30s"         # Timeout for reading the entire request
  write_timeout: "30s"        # Timeout for writing the response  
  idle_timeout: "120s"        # Keep-alive timeout for idle connections

cloud_sync:
  # Production URLs - Using path-based routing with BASE_PATH-TENANT_ID-COMMUNITY_ID
  # Cloud-sync is configured with BASE_PATH="cloudsync", TENANT_ID="737373", COMMUNITY_ID="828282"
  # This creates the path prefix: /cloudsync-737373-828282
  http_url: "http://localhost:8080"
  ws_url: "ws://localhost:8080/ws"
  http_timeout: "600s"  # 10 minutes for large data transfers
  
  # OAuth2 authentication (required for vm-sync)
  oauth2:
    enabled: true
    # Using live-generated credentials
    client_id: "vm_sync_33730300798c7635"
    client_secret: "f5574391677d130886ff1ba016de18942b5bf362749e7d3d750259bfaa284e80"
    token_url: "http://localhost:8080/api/auth/token"

mongodb:
  # Development URI (replace with ${MONGODB_URI} for production)
  uri: "mongodb://localhost:27017/?retryWrites=true&w=majority"
  timeout: 30s

# Collections to sync from real_transfer_test database
# Format: "source-db.collection:target-db.collection" or "source-db.collection" (uses same name)
collections:
  - "real_transfer_test.products:local_sync_test.products"
  - "real_transfer_test.customers:local_sync_test.customers"
  - "real_transfer_test.orders:local_sync_test.orders"
  - "real_transfer_test.inventory:local_sync_test.inventory"
# Sync configuration
sync:
  initial_sync: true
  realtime_sync: false  # Disabled in favor of scheduler-based sync
  scheduler_sync: true  # Enable scheduler-based sync to receive incremental updates
  scheduler_interval: "30m"  # Should match cloud-sync interval
  resumable_initial_sync: true  # Enable to resume from last sync state instead of full re-sync
  batch_size: 100      # Very small batches for reliable transfers
  parallel_collections: true
  max_workers: 4       # Optimized for stability
  retry_attempts: 3    # Number of retry attempts for failed operations
  retry_delay: "5s"    # Delay between retry attempts
  # Ultra-Stable TCP Transport Configuration for production reliability
  transport:
    mode: "tcp"  # Use TCP transport for initial dumps ("http" for legacy mode)
    http_fallback: true  # Accept HTTP fallback from cloud-sync
    compression_type: "zstd"  # Use Zstd compression for best ratio
    tcp_receiver:
      listen_addr: "0.0.0.0:9000"  # TCP receiver listen address
      max_connections: 20           # Ultra-stable: Increased connections
      read_timeout: 200s            # Ultra-stable: 200s read timeout
      write_timeout: 120s           # Ultra-stable: 120s write timeout
      buffer_size: 1048576          # Ultra-stable: 1MB buffer
      disk_checkpoint: true
      checkpoint_dir: "/tmp/vm-sync-tcp-checkpoints"
      heartbeat_interval: 90s       # Ultra-stable: 90s heartbeat
      max_batch_size: 67108864      # Ultra-stable: 64MB batches
      tls_enabled: false

# Internal cluster configuration
# Multiple vm-sync instances can form a cluster for high availability
cluster:
  enabled: true
  node_id: "vm-sync-node-1"  # Change to unique ID for each node (e.g., vm-sync-prod-1)
  discovery_port: 9090       # Change to 9091, 9092, etc. for additional nodes
  heartbeat_interval: "10s"
  election_timeout: "5s"
  log_level: "info"          # Use "warn" for production

# Encryption configuration (must match cloud-sync)
encryption:
  enabled: true
  algorithm: "AES-256-GCM"
  # Development key (use ${ENCRYPTION_KEY_ID} for production)
  key_id: "cloud-sync-key-001"
  # Development key (use ${ENCRYPTION_KEY} for production) - NEVER hardcode in production
  key: "dGVzdC1lbmNyeXB0aW9uLWtleS0yNTYtYml0cy1mb3ItYWVzLWdj"  # Base64 encoded 32-byte key

# Connection and retry configuration
connection:
  reconnect_interval: "5s"
  max_reconnect_attempts: 10
  connection_timeout: "300s"  # Increased for large data transfers
  keepalive_interval: "30s"

# Logging configuration
logging:
  level: "info"        # Use "warn" for production
  format: "json"
  output: "stdout"
  include_timestamps: true

# Performance tuning
performance:
  buffer_size: 10000
  flush_interval: "500ms"
  max_batch_wait: "5s"
  compression_enabled: true

# Health check configuration
health:
  enabled: true
  port: 8081
  path: "/health"
  interval: "30s"

# Metrics configuration
metrics:
  enabled: true
  port: 8082
  path: "/metrics"
  collection_interval: "10s"

# Checkpoint configuration for client-side resume token tracking
checkpoint:
  enabled: true
  database: "vm_sync_checkpoints"
  collection: "client_resume_tokens"
  save_interval_seconds: 3
  cleanup_enabled: true
  retention_days: 7

# Checkpoint configuration for client-side resume token tracking
checkpoint:
  enabled: true
  database: "vm_sync_checkpoints"
  collection: "client_resume_tokens"
  save_interval_seconds: 3
  cleanup_enabled: true
  retention_days: 7

# Watermarks configuration for exactly-once semantics
watermarks:
  enabled: true
  database: "vm_sync_watermarks"
  collection: "event_watermarks"

# Sequence configuration for ordered event processing
sequence:
  enabled: true
  database: "vm_sync_sequences"
  collection: "sequence_counters"
  batch_size: 500
  node_id: "vm-sync-node-001"

# Cluster time fence for snapshot consistency
fence:
  enabled: true

# Example configuration for multiple nodes:
# 
# Node 2 configuration changes:
# cluster:
#   node_id: "vm-sync-node-2"
#   discovery_port: 9091
# health:
#   port: 8083
# metrics:
#   port: 8084
# sequence:
#   node_id: "vm-sync-node-002"
#
# Node 3 configuration changes:
# cluster:
#   node_id: "vm-sync-node-3"
#   discovery_port: 9092
# health:
#   port: 8085
# metrics:
#   port: 8086
# sequence:
#   node_id: "vm-sync-node-003"