# ==================== TAGS ====================
tags:
  - name: OAuth2 Authentication
    description: |
      OAuth2 Client Credentials Grant flow for secure API authentication.
      Supports cryptographically secure client credential generation and JWT token management.
      
      **Security Features:**
      - Client secrets hashed with bcrypt
      - JWT tokens with HMAC-SHA256 signing
      - 1-hour token expiry with automatic refresh
      - Comprehensive scope-based authorization
      
      **Supported Scopes:**
      - `vm-sync`: Core VM synchronization operations
      - `data:read`, `data:write`: Data access permissions
      - `stream:create`, `stream:read`, `stream:write`: Stream operations
      - `metrics:read`, `health:read`: Monitoring access
      - `config:read`: Configuration access
      - `admin:*`: Administrative operations

  - name: OAuth2 Administration
    description: |
      Administrative endpoints for OAuth2 client management.
      
      **Operations:**
      - Create new OAuth2 clients with secure credentials (public for testing)
      - List existing clients (secrets redacted) - requires admin API key
      - Revoke client credentials - requires admin API key
      
      **Security Notes:**
      - Client creation is publicly accessible via Swagger UI for testing
      - Admin operations require `X-Admin-API-Key` header

  - name: Data Synchronization
    description: |
      Core data synchronization endpoints for real-time MongoDB replication.
      Supports pagination, filtering, resume tokens, and partition management.
      
      **Features:**
      - MongoDB change stream integration
      - Resume token management for fault tolerance
      - Batch processing with configurable sizes
      - Document and field-level filtering
      - Partition-based distribution

  - name: Sync Control
    description: |
      Manual synchronization control and status monitoring.
      
      **Capabilities:**
      - Trigger manual initial sync operations
      - Monitor sync progress and status
      - Force resync with resume token bypass
      - Collection-level sync management

  - name: Health & Monitoring
    description: |
      System health checks and comprehensive monitoring endpoints.
      
      **Monitoring Areas:**
      - MongoDB connectivity and performance
      - Service health and availability
      - System resource utilization
      - Feature status and capabilities
      - Component-level health checks

  - name: Metrics
    description: |
      Comprehensive metrics collection and export.
      
      **Formats:**
      - Prometheus/OpenMetrics for monitoring systems
      - JSON format for dashboard consumption
      - Real-time and historical data
      
      **Metrics Categories:**
      - Performance metrics (throughput, latency)
      - Sync metrics (documents, collections)
      - Error metrics (rates, types)
      - System metrics (CPU, memory, connections)

  - name: Alerts
    description: |
      Alert management and notification system.
      
      **Features:**
      - Configurable alert rules with thresholds
      - Multiple severity levels
      - Alert history and acknowledgment
      - Integration with external notification systems

  - name: Dashboard
    description: |
      Web-based dashboard interfaces and supporting APIs.
      
      **Interfaces:**
      - Full-featured dashboard with glassmorphism design
      - Simplified dashboard for mobile/low-bandwidth
      - Real-time updates via WebSocket
      - Interactive system controls
      
      **Features:**
      - Live metrics visualization
      - Enhanced logging with filtering
      - System control actions
      - Chart data for visualization

  - name: Adaptive Controller
    description: |
      Intelligent performance optimization system.
      
      **Capabilities:**
      - Automatic performance tuning
      - Resource utilization optimization
      - Dynamic parallelism adjustment
      - Learning-based optimization
      - Effectiveness measurement and reporting

  - name: Collection Distribution
    description: |
