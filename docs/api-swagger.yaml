  # ==================== WEBSOCKET ENDPOINT ====================
  /ws:
    get:
      tags:
        - WebSocket
      summary: WebSocket Connection Endpoint
      description: |
        WebSocket endpoint for real-time communication between cloud-sync and vm-sync clients.
        Supports OAuth2 authentication and real-time data streaming.
        
        **Connection Protocol:**
        1. Establish WebSocket connection
        2. Send OAuth2 authentication message
        3. Receive authentication confirmation
        4. Begin real-time data streaming
        
        **Authentication Message Format:**
        ```json
        {
          "type": "oauth2_auth",
          "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        }
        ```
      operationId: connectWebSocket
      responses:
        '101':
          description: WebSocket connection established
        '400':
          description: Invalid WebSocket request
        '401':
          description: Authentication required
        '403':
          description: Authentication failed

    # OAuth2 Schemas
    TokenRequest:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum: ["client_credentials"]
          description: OAuth2 grant type (only client_credentials supported)
          example: "client_credentials"
        client_id:
          type: string
          description: OAuth2 client identifier (generated by system)
          pattern: '^vm_sync_[a-f0-9]{16}$'
          example: "vm_sync_3e67555ad3836e65"
        client_secret:
          type: string
          description: OAuth2 client secret (64 hex characters)
          pattern: '^[a-f0-9]{64}$'
          example: "4684a92c64ad93d075018f0152fc5d0ac2f9d73ba2589b32c30e664e82e21e95"
        scope:
          type: string
          description: Requested scopes (space-separated)
          example: "sync data:read data:write"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          enum: ["Bearer"]
          example: "Bearer"
        expires_in:
          type: integer
          format: int64
          description: Token expiry time in seconds
          example: 3599
        scope:
          type: string
          description: Granted scopes
          example: "[sync data:read data:write]"
        refresh_token:
          type: string
          description: Refresh token (not currently implemented)

    OAuth2Error:
      type: object
      properties:
        error:
          type: string
          enum: ["invalid_request", "invalid_client", "invalid_grant", "unauthorized_client", "unsupported_grant_type", "invalid_scope", "server_error"]
          example: "invalid_client"
        error_description:
          type: string
          description: Human-readable error description
          example: "Invalid client credentials"
        error_uri:
          type: string
          description: URI to error documentation
          format: uri

    CreateClientRequest:
      type: object
      required:
        - app_id
        - name
        - scopes
        - vm_metadata
      properties:
        app_id:
          type: string
          description: Application identifier
          example: "vm-sync-production"
        name:
          type: string
          description: Human-readable client name
          example: "Production VM-Sync Instance"
        description:
          type: string
          description: Client description
          example: "OAuth2 client for production VM synchronization"
        scopes:
          type: array
          items:
            type: string
            enum: ["vm-sync", "data:read", "data:write", "stream:create", "stream:read", "stream:write", "metrics:read", "health:read", "config:read", "admin:*"]
          description: Requested OAuth2 scopes
          example: ["sync", "data:read", "data:write", "metrics:read"]
        expires_in:
          type: integer
          format: int64
          description: Client credential expiry time in seconds (optional)
          example: 31536000
        vm_metadata:
          $ref: '#/components/schemas/VMClientMetadata'

    CreateClientResponse:
      type: object
      properties:
        client_id:
          type: string
          description: Generated OAuth2 client ID
          example: "vm_sync_a1b2c3d4e5f6a7b8"
        client_secret:
          type: string
          description: Generated OAuth2 client secret (only returned once)
          example: "9f8e7d6c5b4a39284756adf123456789abcdef0123456789abcdef0123456789"
        app_id:
          type: string
          example: "vm-sync-production"
        name:
          type: string
          example: "Production VM-Sync Instance"
        scopes:
          type: array
          items:
            type: string
          example: ["sync", "data:read", "data:write", "metrics:read"]
        created_at:
          type: string
          format: date-time
          example: "2025-09-26T12:00:00Z"
        expires_at:
          type: string
          format: date-time
          description: Client credential expiry (if set)

    ClientCredentialsResponse:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        client_id:
          type: string
          example: "vm_sync_a1b2c3d4e5f6a7b8"
        client_secret:
          type: string
          enum: ["[REDACTED]"]
          description: Client secret is always redacted in list responses
        app_id:
          type: string
          example: "vm-sync-production"
        name:
          type: string
          example: "Production VM-Sync Instance"
        description:
          type: string
          example: "OAuth2 client for production VM synchronization"
        scopes:
          type: array
          items:
            type: string
          example: ["sync", "data:read", "data:write"]
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          example: "admin"
        vm_metadata:
          $ref: '#/components/schemas/VMClientMetadata'

    VMClientMetadata:
      type: object
      properties:
        hostname:
          type: string
          description: VM hostname
          example: "prod-vm-01.company.com"
        max_collections:
          type: integer
          description: Maximum collections this VM can handle
          example: 50
        supported_streams:
          type: array
          items:
            type: string
          description: Supported stream types
          example: ["change_stream", "initial_sync"]
        capabilities:
          type: object
          additionalProperties:
            type: boolean
          description: VM capabilities
          example:
            tcp_transport: true
            compression: true
            encryption: true
        resource_limits:
          $ref: '#/components/schemas/ResourceLimits'
        network_info:
          $ref: '#/components/schemas/NetworkInfo'

    ResourceLimits:
      type: object
      properties:
        max_memory_mb:
          type: integer
          description: Maximum memory usage in MB
          example: 2048
        max_concurrency:
          type: integer
          description: Maximum concurrent operations
          example: 10
        max_bandwidth_mb:
          type: integer
          description: Maximum bandwidth usage in MB/s
          example: 100

    NetworkInfo:
      type: object
      properties:
        tcp_endpoint:
          type: string
          description: TCP endpoint for high-performance data transfer
          example: "tcp://prod-vm-01:9000"
        http_endpoint:
          type: string
          description: HTTP endpoint for REST API
          example: "http://prod-vm-01:8081"
        ws_endpoint:
          type: string
          description: WebSocket endpoint for real-time communication
          example: "ws://prod-vm-01:8081/ws"

    # Monitoring Schemas
    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Log entry timestamp
          example: "2025-09-26T12:00:00.000Z"
        stage:
          type: string
          description: Application stage/component
          example: "cloud-sync"
        action:
          type: string
          description: Action being performed
          example: "data_sync"
        status:
          type: string
          enum: ["success", "error", "warning", "info"]
          example: "success"
        message:
          type: string
          description: Log message
          example: "Successfully synchronized 1000 documents"
        level:
          type: string
          enum: ["debug", "info", "warn", "error", "fatal"]
          example: "info"
        details:
          type: object
          additionalProperties: true
          description: Additional structured data
          example:
            collection: "users"
            documents_count: 1000
            duration_ms: 234
        context:
          type: object
          properties:
            correlation_id:
              type: string
              example: "req-123456789"
            user_id:
              type: string
              example: "admin"
            client_id:
              type: string
              example: "vm_sync_a1b2c3d4e5f6a7b8"
        duration:
          type: number
          format: float
          description: Operation duration in milliseconds
          example: 234.5
        stack_trace:
          type: array
          items:
            type: string
          description: Stack trace for errors

    Alert:
      type: object
      properties:
        id:
          type: string
          example: "alert-001"
        rule_id:
          type: string
          example: "high-latency-rule"
        severity:
          type: string
          enum: ["low", "medium", "high", "critical"]
          example: "high"
        title:
          type: string
          example: "High Latency Detected"
        message:
          type: string
          example: "Average latency exceeds 500ms threshold"
        status:
          type: string
          enum: ["active", "resolved", "acknowledged"]
          example: "active"
        triggered_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          example:
            current_latency: 750
            threshold: 500
            component: "data_sync"

    AlertRule:
      type: object
      required:
        - name
        - condition
        - severity
      properties:
        id:
          type: string
          readOnly: true
          example: "rule-001"
        name:
          type: string
          description: Rule name
          example: "High Latency Alert"
        description:
          type: string
          description: Rule description
          example: "Triggers when average latency exceeds threshold"
        condition:
          type: object
          description: Alert condition configuration
          properties:
            metric:
              type: string
              example: "avg_latency_ms"
            operator:
              type: string
              enum: ["gt", "lt", "eq", "gte", "lte", "ne"]
              example: "gt"
            threshold:
              type: number
              example: 500
            duration:
              type: integer
              description: Duration in seconds before triggering
              example: 300
        severity:
          type: string
          enum: ["low", "medium", "high", "critical"]
          example: "high"
        enabled:
          type: boolean
          example: true
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: ["email", "webhook", "log"]
              config:
                type: object
                additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    # Error Response Schema
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error code
          example: "invalid_request"
        message:
          type: string
          description: Human-readable error message
          example: "The request is invalid or malformed"
        details:
          type: object
          additionalProperties: true
          description: Additional error details
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        correlation_id:
          type: string
          description: Request correlation ID for tracking
          example: "req-123456789"

    # Health Check Schema
    HealthStatus:
      type: object
      properties:
        overall_status:
          type: string
          enum: ["healthy", "degraded", "unhealthy"]
          example: "healthy"
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "mongodb"
              status:
                type: string
                enum: ["healthy", "degraded", "unhealthy"]
              message:
                type: string
                example: "Connected successfully"
              last_check:
